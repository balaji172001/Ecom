version: '3.8'

services:
  # Nginx Load Balancer (round-robin across backend replicas)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # Scalable Backend Service (multiple instances)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/sivakasicracker
      - JWT_SECRET=production_super_secret_jwt_key_sivakasi_2026
      - ENABLE_CLUSTER=true
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      - mongo

  # MongoDB Instance with high connection limit
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --maxConns 2000

volumes:
  mongo_data:
